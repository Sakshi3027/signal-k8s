apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api
  labels:
    app: signal-api
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: signal-api
  template:
    metadata:
      labels:
        app: signal-api
    spec:
      containers:
        - name: signal-api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: {{ .Values.api.port }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
          envFrom:
            - configMapRef:
                name: signal-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: signal-secrets
                  key: database-url
