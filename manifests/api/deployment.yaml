apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-api
  labels:
    app: signal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal-api
  template:
    metadata:
      labels:
        app: signal-api
    spec:
      containers:
        - name: signal-api
          image: signal-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: signal-secrets
                  key: database-url
            - name: QDRANT_URL
              value: "http://qdrant-service:6333"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
