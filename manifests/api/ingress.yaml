apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - signal.yourdomain.com
      secretName: signal-tls
  rules:
    - host: signal.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal-api-service
                port:
                  number: 80
